version: 1
base:
  # Typography
  font.family.sans: '"Instrument Sans", Inter, ui-sans-serif, system-ui, sans-serif'
  font.family.body: '"Instrument Sans", Inter, ui-sans-serif, system-ui, sans-serif'
  font.family.heading: '"Instrument Sans", Inter, ui-sans-serif, system-ui, sans-serif'
  font.family.mono: '"IBM Plex Mono", "SFMono-Regular", Consolas, monospace'
  font.size.badge: 0.75rem
  font.size.xs: 0.75rem
  font.size.sm: 0.875rem
  font.size.md: 1rem
  font.size.lg: 1.25rem
  font.size.xl: 1.5rem
  font.size.xxl: 2.25rem
  font.size.2xl: 2.25rem
  font.size.3xl: 3.25rem
  font.weight.regular: "400"
  font.weight.medium: "500"
  font.weight.semibold: "600"
  font.weight.bold: "700"
  line.height.heading: "1.15"
  line.height.body: "1.6"
  line.height.code: "1.45"

  # Spacing
  space.xs: 0.25rem
  space.sm: 0.5rem
  space.md: 1rem
  space.lg: 1.5rem
  space.xl: 2rem
  space.xxl: 3rem
  space.2xl: 3.5rem

  # Shape and elevation
  radius.none: 0px
  radius.xs: 0.125rem
  radius.sm: 0.25rem
  radius.md: 0.375rem
  radius.lg: 0.5rem
  radius.xl: 0.75rem
  radius.full: 9999px
  shadow.sm: 0 1px 2px 0 rgb(11 18 32 / 0.05)
  shadow.md: 0 4px 12px -2px rgb(11 18 32 / 0.08), 0 2px 4px -1px rgb(11 18 32 / 0.04)
  shadow.lg: 0 12px 32px -4px rgb(11 18 32 / 0.12), 0 4px 8px -2px rgb(11 18 32 / 0.06)
  shadow.card: 0 24px 48px -12px rgb(7 13 23 / 0.28)

  # Controls and motion
  control.height: 2.5rem
  transition.fast: 120ms cubic-bezier(0.16, 1, 0.3, 1)
  transition.normal: 200ms cubic-bezier(0.16, 1, 0.3, 1)
themes:
  light:
    # Canvas and surfaces
    color.background: "#FAF6EF"
    color.surface: "#FFFDF7"
    color.surface.subtle: "#F0EAD9"

    # Content and boundaries
    color.text: "#1C1917"
    color.text.muted: "#57534E"
    color.text.subtle: "#A8A29E"
    color.border: "#D6CDB8"
    color.border.subtle: "#EAE3D1"

    # Brand and interaction
    color.primary: "#B3472F"
    color.primary.hover: "#9A3C27"
    color.on-primary: "#FFF8F0"
    color.accent.primary: "#5B7A3D"
    color.accent.primary-subtle: "rgb(91 122 61 / 0.12)"
    color.accent.secondary: "#B98A2E"
    color.accent.secondary-subtle: "rgb(185 138 46 / 0.12)"
    color.accent.on-fixed: "#F2D9A8"
    color.focus: "#B3472F"

    # Feedback and status
    color.danger: "#B3261E"
    color.danger.hover: "#9A1F18"
    color.on-danger: "#FFFFFF"
    color.success: "#4C7A3C"
    color.on-success: "#FFFFFF"
    color.warning: "#B7791F"
    color.on-warning: "#FFFFFF"
    color.badge.active-bg: "#5B7A3D26"
    color.badge.active-text: "#4A6330"
    color.badge.risk-bg: "#B3261E26"
    color.badge.risk-text: "#A11B14"
    color.success-subtle: "rgb(76 122 60 / 0.15)"
    color.warning-subtle: "rgb(183 121 31 / 0.15)"

    # Fixed dark presentation surfaces
    color.fixed-canvas: "#1A1610"
    color.fixed-surface: "#241E15"
    color.fixed-border: "#3A3222"
    color.fixed-text: "#F2EAD7"
    color.fixed-text-muted: "#A89E8A"
    color.fixed-overlay: "rgb(242 234 215 / 0.08)"
    color.fixed-overlay-strong: "rgb(242 234 215 / 0.10)"
    color.terminal-background: "#19150F"
    color.terminal-surface: "#241E15"
    color.terminal-border: "#3A3222"
    color.terminal-text: "#E8DFC8"
    color.terminal-text-muted: "#A89E8A"
    color.terminal-info: "#D9B15C"
    color.terminal-success: "#8FA56B"
    color.terminal-warning: "#E0B458"
    color.terminal-danger: "#E5574B"
    color.terminal-danger-text: "#F5A397"
    color.window-close: "#B3472F"
    color.window-minimize: "#B98A2E"
    color.window-maximize: "#5B7A3D"
  dark:
    # Canvas and surfaces
    color.background: "#171310"
    color.surface: "#211B14"
    color.surface.subtle: "#2B241B"

    # Content and boundaries
    color.text: "#F2EAD7"
    color.text.muted: "#A89E8A"
    color.text.subtle: "#6E6655"
    color.border: "#3B3324"
    color.border.subtle: "#2B241B"

    # Brand and interaction
    color.primary: "#E2705A"
    color.primary.hover: "#F08A74"
    color.on-primary: "#2A1208"
    color.accent.primary: "#8FA56B"
    color.accent.primary-subtle: "rgb(143 165 107 / 0.14)"
    color.accent.secondary: "#D9B15C"
    color.accent.secondary-subtle: "rgb(217 177 92 / 0.14)"
    color.accent.on-fixed: "#F2D9A8"
    color.focus: "#E2705A"

    # Feedback and status
    color.danger: "#E5574B"
    color.danger.hover: "#D2473C"
    color.on-danger: "#FFFFFF"
    color.success: "#7FA86B"
    color.on-success: "#0F1A08"
    color.warning: "#E0B458"
    color.on-warning: "#2A1208"
    color.badge.active-bg: "#8FA56B30"
    color.badge.active-text: "#A9BE86"
    color.badge.risk-bg: "#E5574B30"
    color.badge.risk-text: "#F08A74"
    color.success-subtle: "rgb(127 168 107 / 0.16)"
    color.warning-subtle: "rgb(224 180 88 / 0.16)"

    # Fixed dark presentation surfaces
    color.fixed-canvas: "#1A1610"
    color.fixed-surface: "#241E15"
    color.fixed-border: "#3A3222"
    color.fixed-text: "#F2EAD7"
    color.fixed-text-muted: "#A89E8A"
    color.fixed-overlay: "rgb(242 234 215 / 0.08)"
    color.fixed-overlay-strong: "rgb(242 234 215 / 0.10)"
    color.terminal-background: "#19150F"
    color.terminal-surface: "#241E15"
    color.terminal-border: "#3A3222"
    color.terminal-text: "#E8DFC8"
    color.terminal-text-muted: "#A89E8A"
    color.terminal-info: "#D9B15C"
    color.terminal-success: "#8FA56B"
    color.terminal-warning: "#E0B458"
    color.terminal-danger: "#E5574B"
    color.terminal-danger-text: "#F5A397"
    color.window-close: "#B3472F"
    color.window-minimize: "#B98A2E"
    color.window-maximize: "#5B7A3D"
