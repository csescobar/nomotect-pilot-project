en:
  ej2_showcase:
    title: "EJ2 Component Showcase"
    description: "Interactive demonstrations of Syncfusion EJ2 components integrated with NomoTect design tokens via reusable Stimulus controllers."
    nav:
      forms: "Forms & Inputs"
      buttons: "Buttons & Actions"
      dialogs: "Dialogs & Modals"
      cards: "Cards & Panels"
      toolbar: "Toolbars"
      grid: "Data Grid"
      toasts: "Toasts & Alerts"
      loading: "Loading & Spinners"
    forms:
      title: "EJ2 Form Components"
      description: "Syncfusion EJ2 inputs, selects, date pickers and multi-selects with full NomoTect design token integration."
      text_input:
        title: "TextBox"
        description: "Single-line text input with floating label and validation states."
        label: "Full Name"
        placeholder: "Enter your full name"
        help: "Use the full legal name as it appears on official documents."
        error: "Full name is required."
      numeric_input:
        title: "NumericTextBox"
        description: "Numeric input with step controls, min/max and format options."
        label: "Quantity"
        placeholder: "0"
        help: "Enter a value between 1 and 1000."
      dropdown:
        title: "DropDownList"
        description: "Single-select dropdown with search and grouping support."
        label: "Status"
        placeholder: "Select a status..."
        help: "Choose the current status of the record."
        options:
          active: "Active"
          inactive: "Inactive"
          pending: "Pending"
          archived: "Archived"
      datepicker:
        title: "DatePicker"
        description: "Calendar popup with keyboard navigation and locale-aware formatting."
        label: "Start Date"
        placeholder: "Select a date"
        help: "Choose the start date for this record."
      multiselect:
        title: "MultiSelect"
        description: "Multi-value select with chip display, filtering and select-all."
        label: "Tags"
        placeholder: "Select tags..."
        help: "Assign one or more tags to classify this record."
        options:
          critical: "Critical"
          high: "High"
          medium: "Medium"
          low: "Low"
          review: "Under Review"
    dialogs:
      title: "EJ2 Dialog Components"
      description: "Accessible Syncfusion EJ2 modal dialogs for confirmation flows, lifecycle actions, and destructive confirmations."
      confirmation:
        title: "Standard Confirmation Dialog"
        description: "Modal dialog for standard user actions requiring explicit confirmation."
        header: "Confirm Action"
        content: "Are you sure you want to proceed with updating this record?"
        trigger: "Open Confirmation Dialog"
        confirm_btn: "Confirm"
        cancel_btn: "Cancel"
      destructive:
        title: "Destructive Action Dialog"
        description: "High-impact warning modal for deleting records or irreversible actions."
        header: "Delete Organization?"
        content: "This action cannot be undone. All associated projects, memberships, and data will be permanently removed."
        trigger: "Open Delete Confirmation"
        delete_btn: "Delete Organization"
        cancel_btn: "Cancel"
      custom:
        title: "Form / Custom Content Dialog"
        description: "Modal dialog containing form fields or custom HTML content."
        header: "Quick Edit Member"
        trigger: "Open Quick Edit Dialog"
        save_btn: "Save Changes"
        cancel_btn: "Cancel"
    cards:
      title: "EJ2 Card & Panel Components"
      description: "Responsive card layouts and expandable panel components integrated with NomoTect Design Tokens."
      kpi:
        title: "Dashboard KPI Metric Cards"
        description: "High-impact summary cards for displaying metrics, trends, and operational status."
        metric_label: "Total Active Executions"
        metric_value: "1,482"
        metric_trend: "+12.4% vs last month"
      profile:
        title: "Profile & Detail Cards"
        description: "Rich content card with headers, badges, details, and action footers."
        name: "Acme Enterprise Corp"
        subtitle: "Primary Workspace & Operational Tenant"
        badge: "Active Tenant"
        details: "Managing 42 active deployment pipelines across 3 multi-tenant regions."
        action: "View Tenant Settings"
      collapsible:
        title: "Collapsible Panel Card"
        description: "Expandable card component with Stimulus state control and smooth collapse animation."
        header: "Advanced Security Configuration"
        content: "Configure identity providers, SSO SAML 2.0 parameters, IP whitelist rules, and audit logging frequencies for this organization."
        toggle_expand: "Expand Panel"
        toggle_collapse: "Collapse Panel"
    toolbar:
      title: "EJ2 Toolbar Components"
      description: "Responsive toolbar components for action bars, search, filtering, and responsive popup overflow."
      standard:
        title: "Standard Action Toolbar"
        description: "Primary actions toolbar with buttons, separators, and input integration."
        new_record: "New Execution"
        filter: "Filter"
        export: "Export"
        refresh: "Refresh"
      overflow:
        title: "Responsive Overflow Toolbar"
        description: "Toolbar with popup overflow menu for narrow viewports and secondary actions."
        action1: "Run Analysis"
        action2: "Batch Export"
        action3: "Archive Selected"
        action4: "Audit Log"
        action5: "Settings"
    grid:
      title: "EJ2 Data Grid Component"
      description: "High-performance enterprise data grid with sorting, filtering, column chooser, pagination, and design token integration."
      showcase:
        title: "Interactive Enterprise Data Grid"
        description: "Live demonstration of the Syncfusion EJ2 Data Grid engine integrated with NomoTect Design Tokens."
    buttons:
      title: "EJ2 Button Components"
      description: "Action buttons, variants, icons, states, and loading indicators integrated with NomoTect Design Tokens."
      variants:
        title: "Button Variants & Styles"
        description: "Primary, secondary, destructive, outline, and ghost button variants."
        primary: "Primary Action"
        secondary: "Secondary Action"
        destructive: "Destructive Action"
        outline: "Outline Button"
        ghost: "Ghost Action"
      states:
        title: "Button States & Indicators"
        description: "Disabled, icon-only, and interactive loading indicator states."
        disabled: "Disabled State"
        loading: "Processing..."
        trigger_loading: "Click to Test Loading State"
    toasts:
      title: "EJ2 Toast Notification System"
      description: "Non-intrusive feedback toasts for success, error, warning, and info notifications."
      demo:
        title: "Interactive Toast Notifications"
        description: "Trigger system feedback toasts mapped to NomoTect status colors."
        success_btn: "Show Success Toast"
        danger_btn: "Show Error Toast"
        warning_btn: "Show Warning Toast"
        info_btn: "Show Info Toast"
        success_msg: "Operation completed successfully!"
        danger_msg: "Failed to process execution payload. Please check credentials."
        warning_msg: "Rate limit reached. Requests are being throttled."
        info_msg: "System maintenance scheduled for 02:00 UTC."
    loading:
      title: "EJ2 Loading & Spinner Components"
      description: "Smooth loading indicators, spinner overlays, and skeleton placeholder states."
      spinner:
        title: "Container & Card Spinner Overlay"
        description: "Full container overlay spinner for async operations and data loading."
        toggle: "Toggle Loading Overlay"
      skeleton:
        title: "Content Skeleton Placeholders"
        description: "Animated skeleton loaders for initial page loads and async card content."
