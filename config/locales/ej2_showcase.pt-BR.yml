pt-BR:
  ej2_showcase:
    title: "Mostruário de Componentes EJ2"
    description: "Demonstrações interativas dos componentes Syncfusion EJ2 integrados com os design tokens do NomoTect via Stimulus controllers reutilizáveis."
    nav:
      forms: "Formulários & Inputs"
      buttons: "Botões & Ações"
      dialogs: "Diálogos & Modais"
      cards: "Cards & Painéis"
      toolbar: "Barras de Ferramentas"
      grid: "Data Grid"
      toasts: "Toasts & Notifications"
      loading: "Carregamento & Spinners"
    forms:
      title: "Componentes de Formulário EJ2"
      description: "Inputs, selects, date pickers e multi-selects do Syncfusion EJ2 com integração completa aos design tokens do NomoTect."
      text_input:
        title: "TextBox"
        description: "Campo de texto simples com label flutuante e estados de validação."
        label: "Nome Completo"
        placeholder: "Digite seu nome completo"
        help: "Use o nome completo conforme aparece em documentos oficiais."
        error: "O nome completo é obrigatório."
      numeric_input:
        title: "NumericTextBox"
        description: "Campo numérico com controles de passo, mínimo/máximo e opções de formato."
        label: "Quantidade"
        placeholder: "0"
        help: "Insira um valor entre 1 e 1000."
      dropdown:
        title: "DropDownList"
        description: "Dropdown de seleção única com suporte a busca e agrupamento."
        label: "Status"
        placeholder: "Selecione um status..."
        help: "Escolha o status atual do registro."
        options:
          active: "Ativo"
          inactive: "Inativo"
          pending: "Pendente"
          archived: "Arquivado"
      datepicker:
        title: "DatePicker"
        description: "Calendário pop-up com navegação por teclado e formatação localizada."
        label: "Data de Início"
        placeholder: "Selecione uma data"
        help: "Escolha a data de início para este registro."
      multiselect:
        title: "MultiSelect"
        description: "Seleção múltipla com exibição em chips, filtragem e seleção de todos."
        label: "Tags"
        placeholder: "Selecione as tags..."
        help: "Atribua uma ou mais tags para classificar este registro."
        options:
          critical: "Crítico"
          high: "Alto"
          medium: "Médio"
          low: "Baixo"
          review: "Em Revisão"
    dialogs:
      title: "Componentes de Diálogo EJ2"
      description: "Modais de diálogo acessíveis do Syncfusion EJ2 para fluxos de confirmação, ações de ciclo de vida e confirmações destrutivas."
      confirmation:
        title: "Diálogo de Confirmação Padrão"
        description: "Diálogo modal para ações padrão do usuário que requerem confirmação explícita."
        header: "Confirmar Ação"
        content: "Tem certeza de que deseja prosseguir com a atualização deste registro?"
        trigger: "Abrir Diálogo de Confirmação"
        confirm_btn: "Confirmar"
        cancel_btn: "Cancelar"
      destructive:
        title: "Diálogo de Ação Destrutiva"
        description: "Modal de alerta de alto impacto para remoção de registros ou ações irreversíveis."
        header: "Excluir Organização?"
        content: "Esta ação não pode ser desfeita. Todos os projetos, membros e dados associados serão removidos permanentemente."
        trigger: "Abrir Confirmação de Exclusão"
        delete_btn: "Excluir Organização"
        cancel_btn: "Cancelar"
      custom:
        title: "Diálogo de Formulário / Conteúdo Personalizado"
        description: "Diálogo modal contendo campos de formulário ou conteúdo HTML personalizado."
        header: "Edição Rápida de Membro"
        trigger: "Abrir Diálogo de Edição Rápida"
        save_btn: "Salvar Alterações"
        cancel_btn: "Cancelar"
    cards:
      title: "Componentes de Card & Painéis EJ2"
      description: "Layouts de cards responsivos e componentes de painéis expansíveis integrados aos NomoTect Design Tokens."
      kpi:
        title: "Cards de Métrica KPI do Painel"
        description: "Cards de resumo de alto impacto para exibição de métricas, tendências e status operacional."
        metric_label: "Total de Execuções Ativas"
        metric_value: "1.482"
        metric_trend: "+12,4% em relação ao mês anterior"
      profile:
        title: "Cards de Perfil & Detalhes"
        description: "Card de conteúdo rico com cabeçalho, badges, detalhes e rodapé de ações."
        name: "Acme Enterprise Corp"
        subtitle: "Workspace Principal & Tenant Operacional"
        badge: "Tenant Ativo"
        details: "Gerenciando 42 pipelines de implantação ativos em 3 regiões multi-tenant."
        action: "Ver Configurações do Tenant"
      collapsible:
        title: "Card de Painel Expansível"
        description: "Componente de card expansível com controle de estado via Stimulus e animação suave de colapso."
        header: "Configurações Avançadas de Segurança"
        content: "Configure provedores de identidade, parâmetros SSO SAML 2.0, regras de lista branca de IP e frequências de log de auditoria para esta organização."
        toggle_expand: "Expandir Painel"
        toggle_collapse: "Recolher Painel"
    toolbar:
      title: "Componentes de Barra de Ferramentas EJ2"
      description: "Componentes de barra de ferramentas responsivos para barras de ação, busca, filtragem e menu de overflow responsivo."
      standard:
        title: "Barra de Ações Padrão"
        description: "Barra de ferramentas de ações principais com botões, separadores e integração de entradas."
        new_record: "Nova Execução"
        filter: "Filtrar"
        export: "Exportar"
        refresh: "Atualizar"
      overflow:
        title: "Barra de Ferramentas Responsiva com Overflow"
        description: "Barra de ferramentas com menu popup de overflow para telas estreitas e ações secundárias."
        action1: "Executar Análise"
        action2: "Exportação em Lote"
        action3: "Arquivar Selecionados"
        action4: "Log de Auditoria"
        action5: "Configurações"
    grid:
      title: "Componente de Data Grid EJ2"
      description: "Grid de dados empresarial de alta performance com ordenação, filtragem, seletor de colunas, paginação e integração de design tokens."
      showcase:
        title: "Data Grid Empresarial Interativo"
        description: "Demonstração ao vivo do motor de Data Grid do Syncfusion EJ2 integrado aos NomoTect Design Tokens."
    buttons:
      title: "Componentes de Botões EJ2"
      description: "Botões de ação, variantes, ícones, estados e indicadores de carregamento integrados aos NomoTect Design Tokens."
      variants:
        title: "Variantes & Estilos de Botão"
        description: "Variantes de botão primário, secundário, destrutivo, outline e ghost."
        primary: "Ação Principal"
        secondary: "Ação Secundária"
        destructive: "Ação Destrutiva"
        outline: "Botão Outline"
        ghost: "Ação Ghost"
      states:
        title: "Estados & Indicadores de Botão"
        description: "Estados desabilitados, apenas ícone e indicador interativo de carregamento."
        disabled: "Estado Desabilitado"
        loading: "Processando..."
        trigger_loading: "Clique para Testar Carregamento"
    toasts:
      title: "Sistema de Notificações Toast EJ2"
      description: "Toasts de feedback não-intrusivos para notificações de sucesso, erro, aviso e informação."
      demo:
        title: "Notificações Toast Interativas"
        description: "Dispare toasts de feedback do sistema mapeados às cores de status do NomoTect."
        success_btn: "Exibir Toast de Sucesso"
        danger_btn: "Exibir Toast de Erro"
        warning_btn: "Exibir Toast de Aviso"
        info_btn: "Exibir Toast de Informação"
        success_msg: "Operação concluída com sucesso!"
        danger_msg: "Falha ao processar o payload de execução. Por favor, verifique as credenciais."
        warning_msg: "Limite de requisições atingido. As chamadas estão sendo limitadas."
        info_msg: "Manutenção do sistema agendada para 02:00 UTC."
    loading:
      title: "Componentes de Carregamento & Spinner EJ2"
      description: "Indicadores suaves de carregamento, overlays de spinner e estados de skeleton placeholder."
      spinner:
        title: "Overlay de Spinner de Container & Card"
        description: "Spinner de sobreposição de container completo para operações assíncronas e carregamento de dados."
        toggle: "Alternar Overlay de Carregamento"
      skeleton:
        title: "Placeholders de Conteúdo Skeleton"
        description: "Loaders skeleton animados para carregamentos iniciais de página e conteúdo de card assíncrono."
