      foundation_desc: "Ruby 3.4, Rails 8, Hotwire, ViewComponent, and Propshaft providing structured modular conventions."
      design_system_title: "Design System"
      design_system_desc: "Canonical tokens, light and dark themes, strict accessibility, and zero third-party utility clutter."
      data_grid_title: "Enterprise Data Grid"
      data_grid_desc: "Grid DSL with composable filtering, saved user views, server pagination, and CSV/JSON exports."
      architecture_title: "Domain Architecture"
      architecture_desc: "Explicit module contracts, clean layering, inward dependencies, and bounded context isolation."
      multitenancy_title: "Multi-tenant Services"
      multitenancy_desc: "Tenant boundaries, membership scoping, organization switching, and strict data isolation."
