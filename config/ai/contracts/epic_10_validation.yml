id: epic_10_validation
version: 1
owns:
  - validation_plan
  - governed_finding
  - validation_certification
  - release_blocker_policy
  - expiring_risk_acceptance
  - supported_environment_matrix
  - measurable_release_thresholds
  - deterministic_rc_plan
  - protected_rc_approval_boundary
  - representative_application_architecture
  - representative_application_public_contract_boundary
may_use:
  - repository_intelligence
  - release_evidence
  - operational_readiness
  - compatibility_metadata
  - runtime_and_packaging_evidence
  - documented_platform_contracts
cannot_use:
  - release_candidate_publication_during_planning
  - automatic_release_publication
  - silent_risk_acceptance
  - secret_bearing_evidence
  - undocumented_internal_contracts
  - protected_core_modification
  - mandatory_commercial_services
invariants:
  - validation contracts reject unknown fields
  - critical and high findings cannot be accepted as residual risk
  - accepted findings require explicit human approval and expiry
  - passed certification requires every recorded phase to be complete
  - passed certification rejects unresolved critical and high findings
  - certification evidence is bound to a full source commit
  - supported environments cite repository evidence and declare manual validation
  - every quality category defines measurable targets and required evidence
  - RC plans bind versioned inputs to a full source commit
  - RC planning cannot approve or publish its own output
  - representative application journeys use documented public contracts only
  - representative application evidence is deterministic and credential free
  - representative application architecture cannot authorize publication
required_tests:
  - epic_10_contract_validator_test
  - epic_10_release_baseline_test
  - epic_10_rc_preparation_test
