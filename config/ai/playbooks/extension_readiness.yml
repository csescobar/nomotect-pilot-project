id: extension_readiness
version: 2
title: Certify repository readiness for external extensions
inputs:
  - platform_version
on_failure: stop
steps:
  - id: extension_contract
    tool: repository.contract
    args:
      id: extensions
    timeout_seconds: 5
  - id: validation
    tool: repository.validate
    args: {}
    timeout_seconds: 30
  - id: readiness
    tool: repository.readiness
    args: {}
    timeout_seconds: 5
completion_gate:
  - all_steps_pass
  - validation_passes
  - repository_ready
