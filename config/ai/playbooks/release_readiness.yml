id: release_readiness
version: 2
title: Assess repository readiness for a pre-release
inputs:
  - target_version
on_failure: stop
steps:
  - id: release_contract
    tool: repository.contract
    args:
      id: releases
    timeout_seconds: 5
  - id: validation
    tool: repository.validate
    args: {}
    timeout_seconds: 30
  - id: readiness
    tool: repository.readiness
    args: {}
    timeout_seconds: 5
completion_gate:
  - all_steps_pass
  - validation_passes
  - repository_ready
