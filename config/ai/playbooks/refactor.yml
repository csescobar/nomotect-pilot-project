id: refactor
version: 1
title: Refactor or migrate a platform contract safely
inputs:
  - objective
  - target_contract
steps:
  - load_contract_and_dependency_graph
  - run_changed_impact_analysis
  - identify_public_api_and_data_migration_risks
  - preserve_security_tenant_and_privacy_invariants
  - implement_incrementally
  - validate_backwards_compatibility
  - synchronize_documentation
completion_gate:
  - behavior_preserved_or_versioned
  - migration_is_reversible_where_required
  - contracts_valid
  - tests_pass
  - final_ci_green
