  objective: Register and certify a bounded repository-native validation capability.
  guidance:
    - AGENTS.md
    - README.md
    - docs/roadmap/epic-10-plan.md
    - config/ai/contracts/epic_10_validation.yml
  steps:
    - id: discover-boundaries
      documented_context: true
      evidence: AGENTS.md
    - id: identify-public-contract
      documented_context: true
      evidence: config/ai/contracts/epic_10_validation.yml
    - id: implement-bounded-change
      documented_context: true
      evidence: docs/roadmap/epic-10-plan.md
    - id: validate-and-publish-draft
      documented_context: true
      evidence: AGENTS.md
