schema_version: 1
runtimes:
  - name: ruby
    version: 4.0.5
    support_level: certified
    evidence:
      - .ruby-version
      - Gemfile.lock
      - .github/workflows/ci.yml
    manual_required: false
  - name: rails
    version: 8.1.3.1
    support_level: certified
    evidence:
      - Gemfile.lock
      - .github/workflows/ci.yml
    manual_required: false
  - name: postgresql
    version: "18"
    support_level: certified
    evidence:
      - compose.yaml
      - compose.production.yaml
      - .github/workflows/ci.yml
    manual_required: false
browsers:
  - name: chromium
    version: current
    support_level: certified
    evidence:
      - test/application_system_test_case.rb
      - test/system
    manual_required: false
  - name: firefox
    version: current
    support_level: manual
    evidence:
      - docs/validation/release-baseline.md
    manual_required: true
  - name: webkit
    version: current
    support_level: manual
    evidence:
      - docs/validation/release-baseline.md
    manual_required: true
containers:
  - name: docker
    version: current
    support_level: certified
    evidence:
      - Dockerfile
      - compose.yaml
      - .github/workflows/ci.yml
    manual_required: false
  - name: podman
    version: current
    support_level: documented
    evidence:
      - docs/operators/compatibility-and-lifecycle.md
    manual_required: true
deployments:
  - name: compose
    version: development_and_production
    support_level: certified
    evidence:
      - compose.yaml
      - compose.production.yaml
    manual_required: false
  - name: dev_container
    version: current
    support_level: certified
    evidence:
      - .devcontainer/devcontainer.json
      - .github/workflows/ci.yml
    manual_required: false
  - name: kamal_private_vps
    version: "2.12"
    support_level: certified
    evidence:
      - config/deploy.yml
      - bin/kamal-validate
      - bin/vps-preflight
    manual_required: true
  - name: render
    version: blueprint
    support_level: certified
    evidence:
      - render.yaml
      - bin/render-validate
    manual_required: true
thresholds:
  accessibility:
    - id: automated_critical_violations
      comparator: lte
      target: 0
      unit: count
      evidence_required:
        - automated_accessibility_report
    - id: keyboard_blockers
      comparator: lte
      target: 0
      unit: count
      evidence_required:
        - keyboard_journey_report
    - id: manual_screen_reader_review
      comparator: eq
      target: true
      unit: completed
      evidence_required:
        - manual_accessibility_approval
  security:
    - id: unresolved_critical_findings
      comparator: lte
      target: 0
      unit: count
      evidence_required:
        - security_report
    - id: unresolved_high_findings
      comparator: lte
      target: 0
      unit: count
      evidence_required:
        - security_report
    - id: dependency_and_supply_chain_checks
      comparator: eq
      target: true
      unit: passed
      evidence_required:
        - dependency_audit
        - sbom
        - provenance
  privacy:
    - id: secret_bearing_evidence
      comparator: lte
      target: 0
      unit: count
      evidence_required:
        - evidence_redaction_report
    - id: unapproved_personal_data_flows
      comparator: lte
      target: 0
      unit: count
      evidence_required:
        - privacy_review
  performance:
    - id: reference_request_p95
      comparator: lte
      target: 500
      unit: milliseconds
      evidence_required:
        - request_benchmark
    - id: reference_request_queries
      comparator: lte
      target: 25
      unit: count
      evidence_required:
        - query_profile
    - id: background_job_p95
      comparator: lte
      target: 5000
      unit: milliseconds
      evidence_required:
        - job_benchmark
  compatibility:
    - id: required_matrix_failures
      comparator: lte
      target: 0
      unit: count
      evidence_required:
        - compatibility_matrix_report
    - id: manual_matrix_approvals
      comparator: eq
      target: true
      unit: completed
      evidence_required:
        - manual_compatibility_approval
  reliability:
    - id: failed_resilience_scenarios
      comparator: lte
      target: 0
      unit: count
      evidence_required:
        - resilience_report
    - id: recovery_verification
      comparator: eq
      target: true
      unit: passed
      evidence_required:
        - restore_certification
  ai_readiness:
    - id: undocumented_context_steps
      comparator: lte
      target: 0
      unit: count
      evidence_required:
        - contributor_journey
    - id: bounded_change_completion
      comparator: eq
      target: true
      unit: passed
      evidence_required:
        - contributor_journey
