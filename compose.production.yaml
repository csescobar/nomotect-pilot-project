name: nomotect-platform-production

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nomotect_production}
      POSTGRES_USER: ${POSTGRES_USER:-rails_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rails_runtime} -d ${POSTGRES_DB:-nomotect_production}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
    image: ${APP_IMAGE:-nomotect-platform:local}
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      CONTAINER_PREPARE_DATABASE: ${CONTAINER_PREPARE_DATABASE:-false}
      INSTALLATION_ENABLED: ${INSTALLATION_ENABLED:-false}
      INSTALLATION_BOOTSTRAP_TOKEN: ${INSTALLATION_BOOTSTRAP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /rails/tmp
      - /rails/log
    volumes:
      - app-storage:/rails/storage
      - installation-state:/rails/var/installation
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  app-storage:
  installation-state:
