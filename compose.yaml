name: nomotect-platform

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: nomotect_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nomotect_development"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  web:
    build:
      context: .
      target: development
    command: bash -lc "bundle install && bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nomotect_development
      SECRET_KEY_BASE: development-only-secret-key-base-development-only-secret-key-base
      INSTALLATION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle-cache:/usr/local/bundle
      - app-storage:/rails/storage
      - installation-state:/rails/var/installation
    stdin_open: true
    tty: true

volumes:
  postgres-data:
  bundle-cache:
  app-storage:
  installation-state:
